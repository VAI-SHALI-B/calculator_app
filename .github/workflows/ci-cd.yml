name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  ci-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          pytest

      - name: Generate unique image tag
        id: meta
        run: |
          echo "TAG=$(echo $GITHUB_SHA | head -c 7)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ steps.meta.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest

      - name: Deploy to Kubernetes
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.TAG }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          export IMAGE_NAME="$DOCKER_USER/calculator-app:$IMAGE_TAG"
          envsubst < k8s-deployment.yaml | kubectl apply -f -
